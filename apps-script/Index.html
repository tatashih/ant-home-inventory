 <section class="statline"><div class="stat"><b>${all.length}</b><span>管理品項</span></div><div class="stat low"><b>${all.filter(low).length}</b><span>需要補貨</span></div><div class="stat zero"><b>${zeros(w)}</b><span>已經缺貨</span></div></section>
 <div class="searchbox">${ICONS.search}<input id="search" type="search" placeholder="搜尋商品名稱" value="${esc(state.search)}" autocomplete="off"></div>
 ${categoryChips(w)}
 <div class="toolbar"><h3>${state.filter==='待補貨'?'需要補貨的品項':'商品庫存'}</h3>${state.editor?'<div class="toolbar-actions"><button class="add-series" data-action="add-category">＋ 新增系列</button><button class="addbtn" data-action="add-product">＋ 新增商品</button></div>':''}</div>
 ${uncounted(w)?`<div class="note-banner">目前有 ${uncounted(w)} 項尚未盤點，請先填入實際現貨數量。</div>`:""}
 <div id="productlist">${warehouseProducts()}</div>
 <button class="history-shortcut" data-action="history" data-warehouse="${esc(w)}">查看${warehouseShort(w)}小倉庫的更新紀錄 →</button><div class="plain-note">${state.editor?'按 ＋／－ 更新數量，點數字可直接輸入。':'目前是查看模式，想修改請點上方「更新庫存」。'}</div>`;}
function warehouseProducts(){
 const w=state.warehouse;let arr=items(w).filter(x=>{if(state.filter==='待補貨'&&!low(x))return false;if(state.filter!=='待補貨'&&state.filter!=='全部'&&x.category!==state.filter)return false;return !state.search||`${x.name} ${x.category} ${x.notes||''}`.toLowerCase().includes(state.search.trim().toLowerCase());});
 const groups=new Map();
 const searching=!!state.search.trim()||state.filter==='待補貨';
 if(!searching){for(const cat of categoryNames(w)){if(state.filter==='全部'||state.filter===cat)groups.set(cat,[]);}}
 else if(state.filter!=='待補貨'&&!state.search.trim()&&state.filter!=='全部')groups.set(state.filter,[]);
 for(const x of arr){const cat=x.category||'其他';if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(x);}
 if(!groups.size)return `<div class="empty"><b>找不到符合條件的商品</b>可以換個關鍵字，或新增品項。</div>`;
 return [...groups].map(([cat,grp])=>{const hide=!searching&&collapsed(w,cat);const n=grp.filter(low).length;return `<section class="category-block"><div class="category-head"><button class="category-toggle" data-action="toggle-category" data-warehouse="${esc(w)}" data-category="${esc(cat)}" aria-expanded="${hide?'false':'true'}"><span class="category-arrow ${hide?'':'open'}">⌄</span><span class="category-label">${esc(cat)}</span><span class="category-small">${grp.length} 項${n?` · ${n} 待補`:''}</span></button>${state.editor?`<button class="category-rename" data-action="rename-category" data-category="${esc(cat)}" data-warehouse="${esc(w)}" aria-label="修改${esc(cat)}名稱">✎ 改名</button>`:''}</div>${hide?'':`<div class="category-content">${grp.length?grp.map(productRow).join(''):`<div class="category-empty">這個系列目前還沒有商品${state.editor?`<div><button data-action="add-to-category" data-category="${esc(cat)}">＋ 在此系列新增商品</button></div>`:''}</div>`}</div>`}</section>`;}).join('');
}
function productRow(x){
 const unchecked=x.quantity===null||x.quantity===undefined,zero=x.quantity===0,l=low(x),sty=unchecked?'':(zero?'zero':(l?'low':''));
 const qtyText=unchecked?'—':x.quantity;
 const tags=[unchecked?'<span class="tag incoming">待盤點</span>':(zero?'<span class="tag zero">已缺貨</span>':(l?'<span class="tag low">待補貨</span>':'')),x.incoming>0?`<span class="tag incoming">待到貨 ${x.incoming}</span>`:''].filter(Boolean).join('');
 return `<article class="product" data-product="${esc(x.id)}"><div class="product-info"><div class="product-name">${esc(x.name)}</div><div class="product-meta">${tags||'<span class="tag">庫存正常</span>'}${state.editor?`<button class="soft-link" style="font-size:10px;padding:1px 2px" data-action="edit-product" data-id="${esc(x.id)}">編輯品項</button>`:''}</div></div>
 ${state.editor?`<div class="stepper"><button class="step" aria-label="${esc(x.name)} 減一" data-action="step" data-id="${esc(x.id)}" data-delta="-1" ${unchecked||x.quantity<=0?'disabled':''}>−</button><button class="qtybtn ${state.flushing.has(x.id)?'saving':''}" data-action="edit-qty" data-id="${esc(x.id)}"><span class="qty ${sty}">${qtyText}</span><small>${state.flushing.has(x.id)?'儲存中':(unchecked?'點我盤點':'點我修改')}</small></button><button class="step" aria-label="${esc(x.name)} 加一" data-action="step" data-id="${esc(x.id)}" data-delta="1" ${unchecked?'disabled':''}>＋</button></div>`:`<div class="viewerqty"><b class="qty ${sty}">${qtyText}</b><small>${unchecked?'待盤點':'現有數量'}</small></div>`}</article>`;
}
function reorder(){const lowItems=items().filter(low).sort((a,b)=>a.quantity-b.quantity||a.warehouse.localeCompare(b.warehouse));const group=warehouses.map(w=>[w,lowItems.filter(x=>x.warehouse===w)]);return `${topbar()}${demoBanner()}<section class="reorder-head"><div class="eyebrow">RESTOCK WATCHLIST</div><h1>待補貨清單</h1><p>不用等小幫手回報，一打開就看到哪些快沒貨。</p></section>
 <div class="statline"><div class="stat low"><b>${lowItems.length}</b><span>需要補貨</span></div><div class="stat zero"><b>${lowItems.filter(x=>x.quantity===0).length}</b><span>已經缺貨</span></div><div class="stat"><b>${lowItems.filter(x=>x.incoming>0).length}</b><span>其中待到貨</span></div></div>
 <div class="reorder-tools"><b style="font-size:13px">預設提醒門檻：剩 3 個以下</b><button class="copybtn" data-action="copy-low">複製清單</button></div>
 ${group.map(([wh,arr])=>`<div class="group-title"><strong>${warehouseIcon(wh)} ${wh}</strong><span>${arr.length} 項</span></div>${arr.map(x=>`<div class="product"><div class="product-info"><div class="product-name">${esc(x.name)}</div><div class="product-meta"><span class="tag">${esc(x.category)}</span>${x.incoming?`<span class="tag incoming">待到貨 ${x.incoming}</span>`:''}</div></div><div class="viewerqty"><b class="qty ${x.quantity===0?'zero':'low'}">${x.quantity}</b><small>剩餘</small></div></div>`).join('')||'<div class="plain-note">這個倉庫目前都充足 🌿</div>'}`).join('')}
 <div class="note-banner">提醒數量可以由編輯者在「編輯品項」調整。待到貨不列入現貨數量。</div>`;}
function historyView(){
 const w=state.historyWarehouse||'塔塔小倉庫';
 const rows=state.history.filter(x=>x.warehouse===w).slice(0,100);
 return `${topbar()}${demoBanner()}<section class="reorder-head"><div class="eyebrow">UPDATE HISTORY</div><h1>更新紀錄</h1><p>依倉庫獨立查看，每次修改都留下紀錄與更新者。</p></section><div class="warehouse-switch">${warehouses.map(x=>`<button class="${w===x?'chosen':''}" data-action="history-warehouse" data-warehouse="${esc(x)}">${warehouseIcon(x)} ${warehouseShort(x)}小倉庫</button>`).join('')}</div><div class="panel" style="padding:4px 18px">${rows.length?rows.map(a=>`<div class="history-row"><div class="history-dot"></div><div style="min-width:0"><b>${esc(a.name||a.id)} <span style="font-weight:500;color:#9aaa9a">· ${esc(a.action)}</span></b><p>${esc(a.actor||'小幫手')} · ${dateText(a.timestamp)}${a.notes?`<span class="history-note">${esc(a.notes)}</span>`:''}</p></div><div class="delta ${Number(a.delta)<0?'minus':'plus'}">${a.action==='系列改名'?'已改名':a.action==='新增系列'?'已新增':(a.oldQuantity!==undefined&&a.newQuantity!==undefined?`${a.oldQuantity===null?'待盤點':a.oldQuantity} → ${a.newQuantity===null?'待盤點':a.newQuantity}`:'已更新')}</div></div>`).join(''):'<div class="empty" style="border:0">這個倉庫目前沒有更新紀錄</div>'}</div>`;
}
function nav(){return `<nav class="bottom"><div class="nav"><button data-action="home" class="${state.view==='home'||state.view==='warehouse'?'active':''}">${ICONS.home}<span>小倉庫</span></button><button data-action="reorder" class="${state.view==='reorder'?'active':''}">${ICONS.alert}<span>待補貨 ${items().filter(low).length}</span></button><button data-action="history" class="${state.view==='history'?'active':''}">${ICONS.history}<span>更新紀錄</span></button></div></nav>`;}
function modal(){if(!state.modal)return '';const m=state.modal,base=`<div class="modal-overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>`;
 if(m.type==='unlock')return base+`<h2>選擇更新人員</h2><p class="sub">請選擇這次是誰更新庫存，系統會自動記錄在更新紀錄中。</p><form data-form="unlock"><div class="field"><label id="editor-choice-label">更新人員</label><div class="actor-grid" role="group" aria-labelledby="editor-choice-label">${EDITORS.map((name,i)=>`<label class="actor-choice"><input type="radio" name="actor" value="${name}" ${state.actor===name?'checked':''} ${i===0?'required':''}><span class="actor-option"><span class="actor-icon">${name==='螞蟻'?'📦':name==='塔塔'?'🗼':'🌿'}</span><span>${name}</span></span></label>`).join('')}</div></div><div class="actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">開始編輯</button></div></form><p class="foot-help">選擇更新人員後即可編輯，系統會記錄每次修改。</p></div></div>`;
 if(m.type==='qty'){const x=state.items.find(v=>v.id===m.id);if(!x)return '';return base+`<h2>調整庫存數量</h2><p class="sub">${esc(x.warehouse)} · ${esc(x.name)}</p><form data-form="qty"><div class="field"><label>目前實際剩餘幾個？</label><input id="qtyInput" class="count-input" type="number" inputmode="numeric" name="quantity" min="0" max="999999" placeholder="請輸入盤點數量" value="${x.quantity??''}" required></div><div class="actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">儲存數量</button></div></form>${x.incoming>0?`<div class="note-banner">另有 ${x.incoming} 組待到貨，尚未計入現貨。</div><button type="button" class="copybtn" data-action="receive" data-id="${esc(x.id)}" style="width:100%">📦 已收到 ${x.incoming} 組，加入現貨</button>`:''}</div></div>`;}
 if(m.type==='new-category')return base+`<h2>＋ 新增系列</h2><p class="sub">建立在 ${esc(state.warehouse)}，即使沒有商品也會保留，之後可再新增商品。</p><form data-form="new-category"><div class="field"><label>系列名稱</label><input name="categoryName" maxlength="50" placeholder="例如：季節限定系列" autocomplete="off" required></div><div class="actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">新增系列</button></div></form></div></div>`;
 if(m.type==='rename-category')return base+`<h2>修改系列名稱</h2><p class="sub">${esc(m.warehouse)} · 修改後整個系列的商品會一起更新，不影響庫存數量。</p><form data-form="rename-category"><div class="field"><label>新的系列名稱</label><input name="newName" maxlength="50" value="${esc(m.category)}" required></div><div class="actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">儲存系列名稱</button></div></form></div></div>`;
 if(m.type==='product'){const x=m.id?state.items.find(v=>v.id===m.id):null;const w=x?.warehouse||state.warehouse||'塔塔小倉庫',cats=categoryNames(w);return base+`<h2>${x?'編輯品項':'新增商品'}</h2><p class="sub">名稱、分類、補貨提醒數量都可以在這裡修改。</p><form data-form="product"><div class="field"><label>商品名稱</label><input name="name" maxlength="60" value="${esc(x?.name||'')}" placeholder="例如：冰河泥" required></div><div class="two"><div class="field"><label>所屬倉庫</label><select name="warehouse">${warehouses.map(a=>`<option value="${a}" ${w===a?'selected':''}>${warehouseShort(a)}</option>`).join('')}</select></div><div class="field"><label>分類</label><input name="category" list="categories" maxlength="50" value="${esc(x?.category||m.category||cats[0]||'常備品')}" required><datalist id="categories">${warehouses.flatMap(wh=>categoryNames(wh)).filter((cat,i,all)=>all.indexOf(cat)===i).map(y=>`<option value="${esc(y)}"></option>`).join('')}</datalist></div></div><div class="two"><div class="field"><label>現貨剩餘</label><input name="quantity" type="number" inputmode="numeric" min="0" max="999999" value="${x&&x.quantity===null?'':x?.quantity??0}" placeholder="請填實際庫存" required></div><div class="field"><label>剩幾個提醒補貨</label><input name="minStock" type="number" inputmode="numeric" min="0" max="999999" value="${x?.minStock??3}" required></div></div><div class="field"><label>待到貨數量（不算現貨）</label><input name="incoming" type="number" inputmode="numeric" min="0" max="999999" value="${x?.incoming??0}" required></div><div class="field"><label>備註（選填）</label><textarea name="notes" maxlength="200" placeholder="例如：待到貨、特別保留">${esc(x?.notes||'')}</textarea></div><div class="actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">儲存商品</button></div></form>${x?`<button type="button" class="danger-text" data-action="delete-product" data-id="${esc(x.id)}">刪除此品項</button>`:''}</div></div>`;}
 return '';
}
function render(preserve=false){const sy=window.scrollY;app.innerHTML=(state.view==='warehouse'?warehouseView():state.view==='reorder'?reorder():state.view==='history'?historyView():home())+nav()+modal();applyTheme();document.body.style.overflow=state.modal?'hidden':'';if(preserve)requestAnimationFrame(()=>window.scrollTo(0,sy));}
function go(v,w){state.view=v;if(w){state.warehouse=w;state.historyWarehouse=w;}if(v==='history'&&w)state.historyWarehouse=w;state.filter='全部';state.search='';state.modal=null;render();window.scrollTo(0,0);}
function openModal(type,id){state.modal={type,id};render(true);requestAnimationFrame(()=>{document.querySelector('#qtyInput')?.focus();});}
function setLocalQty(id,value){const item=state.items.find(x=>x.id===id);if(!item)return;const before=item.quantity;item.quantity=value;item.updatedAt=new Date().toISOString();item.updatedBy=state.actor;state.history.unshift({timestamp:item.updatedAt,action:'調整庫存',id:item.id,warehouse:item.warehouse,name:item.name,oldQuantity:before,newQuantity:value,delta:before==null?null:value-before,actor:state.actor});saveLocal();}
function changeQty(id,value){const x=state.items.find(v=>v.id===id);if(!x||!state.editor)return;value=Number(value);if(!Number.isSafeInteger(value)||value<0||value>999999){tell('請輸入 0 以上的整數');return;}if(x.quantity===value)return;if(!IS_CLOUD){setLocalQty(id,value);render(true);tell('已更新（僅此裝置）');return;}
 x.quantity=value;x.updatedAt=new Date().toISOString();state.busy.add(id);clearTimeout(state.timers[id]);state.timers[id]=setTimeout(()=>flushQuantity(id),450);render(true);
}
async function flushQuantity(id){if(state.flushing.has(id))return;state.flushing.add(id);state.busy.add(id);render(true);try{while(true){const x=state.items.find(v=>v.id===id);if(!x)break;const target=x.quantity;const expected=state.serverQuantity[id]??null;await invoke('setQuantity',{id,quantity:target,expectedQuantity:expected,actor:state.actor});state.serverQuantity[id]=target;if(!state.items.some(v=>v.id===id&&v.quantity!==target))break;}}catch(e){tell('修改未儲存：'+e.message);state.busy.delete(id);state.flushing.delete(id);await refresh(true);return;}state.flushing.delete(id);state.busy.delete(id);state.lastSync=new Date().toISOString();render(true);}
function copyLow(){const parts=['📦 螞蟻家待補貨清單'];for(const w of warehouses){const arr=items(w).filter(low).sort((a,b)=>a.quantity-b.quantity);if(arr.length){parts.push('\n'+('【'+w+'】'));for(const x of arr)parts.push(`・${x.name}：剩 ${x.quantity}${x.incoming?`（待到貨 ${x.incoming}）`:''}`);}}const text=parts.join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>tell('已複製，可直接貼到 LINE')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();try{document.execCommand('copy');tell('已複製清單');}catch(e){tell('複製失敗，請重新操作');}el.remove();}
async function receive(id){const x=state.items.find(v=>v.id===id);if(!x||x.incoming<=0)return;if(!confirm(`確認「${x.name}」已收到 ${x.incoming} 組，加入現貨庫存？`))return;if(IS_CLOUD){try{await invoke('receiveIncoming',{id,actor:state.actor});state.modal=null;await refresh();tell('到貨已入庫');}catch(e){tell('無法入庫：'+e.message);}}else{const old=x.quantity;x.quantity+=x.incoming;const inc=x.incoming;x.incoming=0;x.updatedAt=new Date().toISOString();state.history.unshift({timestamp:x.updatedAt,action:'到貨入庫',id:x.id,warehouse:x.warehouse,name:x.name,oldQuantity:old,newQuantity:x.quantity,delta:inc,actor:state.actor});saveLocal();state.modal=null;render(true);tell('已加入現貨（預覽）');}}
async function saveProduct(form){const f=new FormData(form),obj={name:String(f.get('name')||'').trim(),warehouse:String(f.get('warehouse')||''),category:String(f.get('category')||'').trim(),quantity:Number(f.get('quantity')),minStock:Number(f.get('minStock')),incoming:Number(f.get('incoming')),notes:String(f.get('notes')||'').trim()};if(state.modal.id)obj.id=state.modal.id;if(obj.notes==='待盤點｜尚未提供初始數量')obj.notes='';if(!obj.name||!obj.category||![obj.quantity,obj.minStock,obj.incoming].every(x=>Number.isSafeInteger(x)&&x>=0)){tell('請正確填寫商品資料');return;}
 if(IS_CLOUD){try{await invoke('upsertProduct',{...obj,actor:state.actor});state.modal=null;await refresh();tell('商品已儲存');}catch(e){tell('儲存失敗：'+e.message);}}
 else{const old=obj.id&&state.items.find(x=>x.id===obj.id);if(old){Object.assign(old,obj,{updatedAt:new Date().toISOString(),updatedBy:state.actor});}else{obj.id='LOCAL-'+Date.now();state.items.push({...obj,updatedAt:new Date().toISOString(),updatedBy:state.actor,active:true});}state.history.unshift({timestamp:new Date().toISOString(),action:old?'更新品項':'新增品項',id:obj.id,warehouse:obj.warehouse,name:obj.name,actor:state.actor});saveLocal();state.modal=null;render(true);tell('商品已儲存（預覽）');}}
async function addCategory(form){
 const warehouse=state.warehouse;
 const name=String(new FormData(form).get('categoryName')||'').trim();
 if(!name||name.length>50){tell('系列名稱需為 1～50 個字');return;}
 if(categoryNames(warehouse).some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){tell('這個倉庫已有相同系列名稱');return;}
 if(IS_CLOUD){
  try{await invoke('addCategory',{warehouse,name,actor:state.actor});state.modal=null;await refresh();state.filter='全部';state.collapsed[catKey(warehouse,name)]=false;saveCollapse();render(true);tell('系列已新增');}
  catch(e){tell('新增失敗：'+e.message);}
 }else{
  state.categories.push({warehouse,name,active:true,createdAt:new Date().toISOString(),createdBy:state.actor});
  state.history.unshift({timestamp:new Date().toISOString(),action:'新增系列',id:'CATEGORY',warehouse,name,actor:state.actor});
  state.modal=null;state.filter='全部';state.collapsed[catKey(warehouse,name)]=false;saveCollapse();saveLocal();render(true);tell('已新增系列（單機預覽）');
 }
}
async function renameCategory(form){
 const m=state.modal;if(!m)return;
 const newName=String(new FormData(form).get('newName')||'').trim(),oldName=m.category,w=m.warehouse;
 if(!newName||newName.length>50){tell('系列名稱請在 1～50 字內');return;}
 if(newName===oldName){state.modal=null;render(true);return;}
 if(categoryNames(w).some(x=>x.toLocaleLowerCase()===newName.toLocaleLowerCase())){tell('同倉庫已有這個系列名稱，請換一個');return;}
 if(IS_CLOUD){try{await invoke('renameCategory',{warehouse:w,oldName,newName,actor:state.actor});state.modal=null;await refresh();tell('系列名稱已更新');}catch(e){tell('改名失敗：'+e.message);}}
 else{
  for(const x of items(w))if(x.category===oldName)x.category=newName;for(const c of state.categories){if(c.warehouse===w&&c.name===oldName)c.name=newName;}
  state.history.unshift({timestamp:new Date().toISOString(),action:'系列改名',id:'CATEGORY',warehouse:w,name:oldName,actor:state.actor,notes:`${oldName} → ${newName}`});
  state.modal=null;saveLocal();render(true);tell('已更新系列名稱（預覽）');
 }
 const oldKey=catKey(w,oldName),newKey=catKey(w,newName);
 if(Object.prototype.hasOwnProperty.call(state.collapsed,oldKey)){state.collapsed[newKey]=state.collapsed[oldKey];delete state.collapsed[oldKey];saveCollapse();render(true);}
}
async function removeProduct(id){const x=state.items.find(v=>v.id===id);if(!x||!confirm(`確定刪除「${x.name}」？這個品項將從清單隱藏。`))return;if(IS_CLOUD){try{await invoke('deleteProduct',{id,actor:state.actor});state.modal=null;await refresh();tell('已刪除品項');}catch(e){tell('刪除失敗：'+e.message);}}else{x.active=false;state.history.unshift({timestamp:new Date().toISOString(),action:'刪除品項',id:x.id,warehouse:x.warehouse,name:x.name,actor:state.actor});saveLocal();state.modal=null;render(true);tell('已刪除（預覽）');}}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action; if(action==='home')return go('home');if(action==='warehouse')return go('warehouse',b.dataset.warehouse);if(action==='reorder')return go('reorder');if(action==='history')return go('history',b.dataset.warehouse||undefined);if(action==='history-warehouse'){state.historyWarehouse=b.dataset.warehouse;render(true);return;}if(action==='refresh'){if(IS_CLOUD)await refresh();else{render(true);tell('預覽資料已更新');}return;}
 if(action==='toggle-editor'){if(state.editor){state.editor=false;render(true);tell('已切換為查看模式');}else openModal('unlock');return;}
 if(action==='filter'){state.filter=b.dataset.filter;render(true);return;}if(action==='toggle-category'){const k=catKey(b.dataset.warehouse,b.dataset.category);state.collapsed[k]=!collapsed(b.dataset.warehouse,b.dataset.category);saveCollapse();const list=document.getElementById('productlist');if(list)list.innerHTML=warehouseProducts();return;}if(action==='add-category'&&state.editor){state.modal={type:'new-category'};render(true);return;}if(action==='add-to-category'&&state.editor){state.modal={type:'product',category:b.dataset.category};render(true);return;}if(action==='rename-category'&&state.editor){state.modal={type:'rename-category',warehouse:b.dataset.warehouse,category:b.dataset.category};render(true);return;}if(action==='close-modal'){state.modal=null;render(true);return;}
 if(action==='edit-qty'&&state.editor)return openModal('qty',b.dataset.id);
 if(action==='step'&&state.editor){const x=state.items.find(v=>v.id===b.dataset.id);if(x)changeQty(x.id,Math.max(0,Number(x.quantity)+Number(b.dataset.delta)));return;}
 if(action==='add-product'&&state.editor)return openModal('product');if(action==='edit-product'&&state.editor)return openModal('product',b.dataset.id);
 if(action==='copy-low')return copyLow();if(action==='receive'&&state.editor)return receive(b.dataset.id);if(action==='delete-product'&&state.editor)return removeProduct(b.dataset.id);
});
app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const target=document.getElementById('productlist');if(target)target.innerHTML=warehouseProducts();}});
app.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form,btn=form.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
 try{if(type==='unlock'){const f=new FormData(form);const selected=String(f.get('actor')||'').trim();if(!EDITORS.includes(selected)){tell('請先選擇螞蟻、塔塔或朵朵');return;}state.actor=selected;sessionStorage.setItem('antStockActor',selected);state.editor=true;state.modal=null;render(true);tell('已進入更新模式');}
 else if(type==='qty'){const x=state.items.find(v=>v.id===state.modal.id);const value=Number(new FormData(form).get('quantity'));state.modal=null;if(x)changeQty(x.id,value);render(true);}
 else if(type==='product')await saveProduct(form);
 else if(type==='rename-category')await renameCategory(form);
  else if(type==='new-category')await addCategory(form);
 }catch(err){tell(err.message||'操作失敗');}finally{if(btn)btn.disabled=false;}
});
app.addEventListener('click',e=>{if(e.target.id==='overlay'){state.modal=null;render(true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render(true);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&IS_CLOUD)refresh(true);});
applyTheme();
if(IS_CLOUD){refresh(false);setInterval(()=>{if(!document.hidden&&state.modal===null)refresh(true);},30000);}else render();
})();
</script>
</body>
</html>
